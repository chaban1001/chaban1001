<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" fill="none" role="img" aria-label="Roman Chaban, Middle Frontend Developer. React, Next.js, TypeScript. Lviv, Ukraine. Open to work. English B2. Lighthouse Performance 90 plus, sign-ups plus 20 percent, page load about 4 seconds to about 2.5 seconds.">
  <title>Roman Chaban, Middle Frontend Developer</title>
