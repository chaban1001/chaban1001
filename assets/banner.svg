  <rect x="48" y="178" width="66" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0"/><text x="63" y="196.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">React</text>
  <rect x="124" y="178" width="81" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0"/><text x="139" y="196.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Next.js</text>
  <rect x="215" y="178" width="103" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0"/><text x="230" y="196.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">TypeScript</text>
  <rect x="48" y="218" width="125" height="28" rx="14" fill="#ffffff" fill-opacity="0.6" stroke="#e2e8f0"/><text x="63" y="236.5" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#475569">Lviv, Ukraine</text>
